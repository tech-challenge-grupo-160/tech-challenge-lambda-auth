name: CI

on:
  pull_request:
    branches: [develop, homolog, main]
  push:
    branches: [develop, homolog, main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente de destino do deploy"
        type: choice
        options: [desenvolvimento, homologacao, producao]
        default: desenvolvimento

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  SOLUTION_FILE: 'Fiap.TechChallenge.OficinaMecanica.AuthLambda.slnx'
  TEST_PROJECT: 'tests/Fiap.TechChallenge.OficinaMecanica.AuthLambda.Tests/Fiap.TechChallenge.OficinaMecanica.AuthLambda.Tests.csproj'
  COVERAGE_SETTINGS: 'coverlet.runsettings'

permissions:
  contents: read
  pull-requests: read
  id-token: write   # necessario para OIDC quando o deploy for habilitado (issue #54)

jobs:
  # Alem do build, este job cobre o que independe de linguagem: higiene do
  # repositorio e ausencia de segredo commitado - critico porque o repositorio
  # e publico.
  hygiene:
    name: Higiene do repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Arquivos obrigatorios presentes
        run: |
          fail=0
          for f in README.md .gitignore .github/PULL_REQUEST_TEMPLATE.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Arquivo obrigatorio ausente: $f"
              fail=1
            fi
          done
          exit $fail

      - name: Nenhum arquivo de credencial versionado
        run: |
          # Repositorio publico: um .env ou .pem commitado vaza na hora.
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|\.pfx$|id_rsa' || true)
          if [ -n "$found" ]; then
            echo "::error::Arquivos sensiveis versionados:"
            echo "$found"
            exit 1
          fi
          echo "OK - nenhum arquivo de credencial versionado."

      - name: Nenhum segredo obvio no diff
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Os padroes ficam em arquivo separado, e esse arquivo e excluido do
          # diff analisado: com as regex aqui dentro, o proprio workflow entrava
          # no diff do PR e casava consigo mesmo, falhando o job.
          # Heuristica simples, sem dependencia externa. Nao substitui uma
          # ferramenta dedicada de secret scanning - ver issue #46.
          # Referencias no formato ${{ secrets.X }} sao a forma correta de usar
          # segredo em workflow: a linha aponta para o cofre, nao expoe o valor.
          # Sem esta exclusao, configurar credenciais na AWS falha o proprio job.
          hits=$(git diff "$base" "$head" -U0 \
              -- . ':(exclude).github/secret-patterns.txt' \
            | grep -E '^\+' \
            | grep -v 'secrets\.' \
            | grep -inE -f .github/secret-patterns.txt \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Possivel segredo no diff:"
            echo "$hits"
            exit 1
          fi
          echo "OK - nada suspeito no diff."

  workflows:
    name: Sintaxe dos workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida YAML dos workflows
        run: |
          python3 - <<'PY'
          import sys, glob, yaml
          erros = 0
          for f in glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
                  print(f'ok   {f}')
              except Exception as e:
                  print(f'ERRO {f}: {e}')
                  erros += 1
          sys.exit(1 if erros else 0)
          PY

  # ---------------------------------------------------------------------------
  # Os jobs abaixo entram quando o runtime for definido na RFC (issue #35).
  # Estao declarados para deixar explicito o que falta, e desabilitados para
  # nao dar falsa sensacao de cobertura.
  # ---------------------------------------------------------------------------

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    needs: [hygiene, workflows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: >
          dotnet build ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --settings ${{ env.COVERAGE_SETTINGS }}
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Resumo da cobertura
        if: always()
        run: |
          file=$(find TestResults -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$file" ]; then
            echo "::warning::Relatorio de cobertura nao encontrado."
            exit 0
          fi
          # line-rate vem como fracao (ex.: 0.8123) no atributo raiz do cobertura
          rate=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -1 | grep -o '[0-9.]*')
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "Cobertura de linhas: ${pct}%"
          echo "### Cobertura de linhas: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publica resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

      # A credencial do Learner Lab e temporaria e trocada a cada sessao.
      # Quando os secrets nao existem, os passos abaixo sao pulados em vez de
      # falhar - assim o CI continua util sem depender de sessao ativa.
      - name: Verifica se ha credenciais da sessao
        id: creds
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem credenciais da sessao. Cadastre os secrets - issue #54."
          fi

      - name: Autenticar na AWS
        if: steps.creds.outputs.has == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Confirmar identidade na AWS
        if: steps.creds.outputs.has == 'true'
        run: |
          # Prova de autenticacao exigida pela issue #54.
          # A conta e mascarada: os repositorios sao publicos.
          aws sts get-caller-identity --query 'Arn' --output text | sed 's/[0-9]\{12\}/<conta>/'
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    # Por push, so a partir das branches de ambiente: homolog publica hom e
    # main publica prod. O workflow_dispatch publica o ambiente escolhido a
    # partir de qualquer branch - e como se publica em dev, e como se valida o
    # pipeline sem promover branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref_name == 'homolog' || github.ref_name == 'main'))
    environment: ${{ inputs.ambiente || (github.ref_name == 'main' && 'producao' || 'homologacao') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Diferente do job de build, aqui a credencial e obrigatoria: sem ela
      # nao ha deploy. Falhar e o comportamento correto.
      - name: Exige credenciais da sessao
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Sem credenciais da AWS. Rode scripts/renova-secrets.sh no repo de infra."
            exit 1
          fi

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Instalar Amazon.Lambda.Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Resolver nome da funcao e role
        id: alvo
        run: |
          AMBIENTE="${{ inputs.ambiente || (github.ref_name == 'main' && 'producao' || 'homologacao') }}"
          # O sufixo casa com var.ambiente do Terraform em infra-k8s: e dele que
          # saem o nome da funcao (tc-grupo160-auth-<sufixo>) e o do segredo
          # (tc-grupo160/<sufixo>/jwt-signing-key). Divergir aqui quebra a
          # integracao do API Gateway silenciosamente.
          case "$AMBIENTE" in
            desenvolvimento) SUFIXO="dev" ;;
            producao)        SUFIXO="prod" ;;
            *)               SUFIXO="hom" ;;
          esac
          # O id da conta vem em runtime: o repositorio e publico.
          CONTA="$(aws sts get-caller-identity --query Account --output text)"
          echo "funcao=tc-grupo160-auth-${SUFIXO}" >> "$GITHUB_OUTPUT"
          echo "role=arn:aws:iam::${CONTA}:role/LabRole" >> "$GITHUB_OUTPUT"
          # Nome do segredo, nunca o valor. Criado pelo Terraform em
          # tech-challenge-infra-k8s (issue #46).
          echo "segredo_jwt=tc-grupo160/${SUFIXO}/jwt-signing-key" >> "$GITHUB_OUTPUT"
          # Credencial do banco, criada pelo Terraform em
          # tech-challenge-infra-database (issue #61).
          echo "segredo_banco=tc-grupo160/${SUFIXO}/banco" >> "$GITHUB_OUTPUT"
          echo "sufixo=${SUFIXO}" >> "$GITHUB_OUTPUT"
          echo "Ambiente: $AMBIENTE  Funcao: tc-grupo160-auth-${SUFIXO}"

      # A funcao precisa entrar na VPC para alcancar o RDS, que fica em subnet
      # privada sem acesso publico. Dentro da VPC ela perde a saida para a
      # internet - nao ha NAT Gateway - e passa a depender do endpoint de
      # interface do Secrets Manager, criado junto com a rede.
      #
      # Os ids sao descobertos por tag em runtime, e nao guardados em variavel
      # do repositorio: mudariam a cada recriacao do ambiente do lab.
      - name: Resolver rede da funcao
        id: rede
        run: |
          SUFIXO="${{ steps.alvo.outputs.sufixo }}"
          SUBNETS="$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=tc-grupo160-${SUFIXO}-privada-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')"
          SG="$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=tc-grupo160-${SUFIXO}-lambda" \
            --query 'SecurityGroups[0].GroupId' --output text)"

          if [ -z "$SUBNETS" ] || [ "$SG" = "None" ] || [ -z "$SG" ]; then
            # Sem rede aplicada nao ha banco para alcancar tambem, entao publicar
            # fora da VPC mantem o pipeline util em vez de falhar.
            echo "::warning::Rede do ambiente ${SUFIXO} nao encontrada. Publicando fora da VPC - a funcao nao alcancara o banco. Aplique o Terraform de tech-challenge-infra-k8s."
            echo "vpc=false" >> "$GITHUB_OUTPUT"
          else
            echo "vpc=true" >> "$GITHUB_OUTPUT"
            echo "subnets=$SUBNETS" >> "$GITHUB_OUTPUT"
            echo "sg=$SG" >> "$GITHUB_OUTPUT"
            echo "Subnets: $SUBNETS  SG: $SG"
          fi

      - name: Deploy da funcao
        run: |
          # deploy-function cria ou atualiza, entao serve para os dois casos.
          # JWT_SECRET_ID carrega o NOME do segredo; a Lambda le o valor do
          # Secrets Manager no cold start. Nenhum segredo trafega aqui nem
          # fica visivel na configuracao da funcao.
          # As duas variaveis carregam NOMES de segredo. Nenhuma credencial
          # trafega aqui nem fica visivel na configuracao da funcao.
          ENVS="JWT_SECRET_ID=${{ steps.alvo.outputs.segredo_jwt }};DB_SECRET_ID=${{ steps.alvo.outputs.segredo_banco }}"

          REDE=""
          if [ "${{ steps.rede.outputs.vpc }}" = "true" ]; then
            REDE="--subnets ${{ steps.rede.outputs.subnets }} --security-groups ${{ steps.rede.outputs.sg }}"
          fi

          # shellcheck disable=SC2086
          dotnet lambda deploy-function "${{ steps.alvo.outputs.funcao }}" \
            --project-location Fiap.TechChallenge.OficinaMecanica.AuthLambda \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --function-role "${{ steps.alvo.outputs.role }}" \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" \
            --environment-variables "$ENVS" \
            $REDE

      - name: Confirmar funcao publicada
        run: |
          aws lambda get-function \
            --function-name "${{ steps.alvo.outputs.funcao }}" \
            --query '{Nome:Configuration.FunctionName,Runtime:Configuration.Runtime,Estado:Configuration.State,Tamanho:Configuration.CodeSize}' \
            --output table

      - name: Resumo
        run: |
          {
            echo "### Deploy concluido"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Funcao | \`${{ steps.alvo.outputs.funcao }}\` |"
            echo "| Ambiente | ${{ inputs.ambiente || (github.ref_name == 'main' && 'producao' || 'homologacao') }} |"
            echo "| Regiao | ${{ vars.AWS_REGION || 'us-east-1' }} |"
            echo "| Segredo do JWT | \`${{ steps.alvo.outputs.segredo_jwt }}\` |"
            echo "| Segredo do banco | \`${{ steps.alvo.outputs.segredo_banco }}\` |"
            echo "| Dentro da VPC | ${{ steps.rede.outputs.vpc }} |"
            if [ "${{ steps.rede.outputs.vpc }}" = "true" ]; then
              echo "| Subnets | \`${{ steps.rede.outputs.subnets }}\` |"
              echo "| Security group | \`${{ steps.rede.outputs.sg }}\` |"
            else
              echo ""
              echo "> Publicada **fora da VPC**: a rede do ambiente nao foi encontrada."
              echo "> A funcao nao alcanca o banco. Aplique o Terraform de tech-challenge-infra-k8s."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
